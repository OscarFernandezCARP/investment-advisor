<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inversión IA - Oscar</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0f1e; color: #fff; font-family: -apple-system, sans-serif; }
.header { display: flex; justify-content: space-between; align-items: center; padding: 20px; border-bottom: 1px solid #1e2a3a; }
.title { font-size: 22px; font-weight: 700; }
.subtitle { font-size: 12px; color: #64748b; margin-top: 4px; }
.btn { background: #3b82f6; color: #fff; border: none; padding: 10px 20px; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; }
.btn:active { opacity: 0.7; }
.content { padding: 16px; max-width: 600px; margin: 0 auto; }
.summary { background: #0d1526; border: 1px solid #1e2a3a; border-radius: 16px; padding: 20px; margin-bottom: 20px; }
.stats { display: flex; gap: 20px; margin-top: 12px; }
.stat { text-align: center; }
.stat-val { font-size: 20px; font-weight: 700; }
.stat-label { font-size: 11px; color: #64748b; }
.card { background: #0d1526; border: 1px solid #1e2a3a; border-radius: 14px; padding: 16px; margin-bottom: 10px; }
.card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.card-left { display: flex; align-items: center; gap: 8px; }
.symbol { font-size: 18px; font-weight: 800; }
.badge { padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; border: 1px solid; }
.alloc { font-size: 18px; font-weight: 700; }
.name { font-size: 13px; color: #94a3b8; margin-bottom: 10px; }
.price-row { display: flex; justify-content: space-between; align-items: center; }
.price { font-size: 22px; font-weight: 700; }
.change { padding: 5px 10px; border-radius: 8px; font-size: 14px; font-weight: 700; }
.up { color: #00d4aa; background: #00d4aa20; }
.down { color: #ff4d6d; background: #ff4d6d20; }
.empty { text-align: center; padding: 60px 20px; }
.empty-icon { font-size: 64px; margin-bottom: 16px; }
.category-title { font-size: 12px; color: #64748b; text-transform: uppercase; letter-spacing: 1.5px; margin: 16px 0 8px; font-weight: 700; }
</style>
</head>
<body>
<div class="header">
  <div>
    <div class="title">📈 Inversión IA</div>
    <div class="subtitle" id="lastUpdate">Presioná ACTUALIZAR</div>
  </div>
  <button class="btn" onclick="loadPrices()" id="btn">⟳ ACTUALIZAR</button>
</div>
<div class="content" id="content">
  <div class="empty">
    <div class="empty-icon">📊</div>
    <div style="font-size:24px;font-weight:700;margin-bottom:12px">Bienvenido, Oscar</div>
    <div style="color:#64748b;line-height:1.6">Presioná ACTUALIZAR para ver<br>los precios de tus 9 activos</div>
  </div>
</div>
<script>
const BACKEND = 'https://supreme-couscous-6979rj6vg7qxf4p4g-3000.app.github.dev';
const CAT_COLORS = { ETF: '#3b82f6', CEDEAR: '#8b5cf6', Bono: '#f59e0b', 'Acción': '#10b981' };

async function loadPrices() {
  const btn = document.getElementById('btn');
  btn.textContent = '⏳ Cargando...';
  btn.disabled = true;
  try {
    const res = await fetch(BACKEND + '/api/prices');
    const data = await res.json();
    if (data.success) render(data.data);
    const now = new Date();
    document.getElementById('lastUpdate').textContent = 'Actualizado ' + now.toLocaleTimeString('es-AR', {hour:'2-digit',minute:'2-digit'});
  } catch(e) {
    alert('Error: ' + e.message);
  }
  btn.textContent = '⟳ ACTUALIZAR';
  btn.disabled = false;
}

function render(assets) {
  const up = assets.filter(a=>a.changePercent>0).length;
  const down = assets.filter(a=>a.changePercent<0).length;
  const cats = ['ETF','CEDEAR','Bono','Acción'];
  let html = `<div class="summary">
    <div style="font-size:12px;color:#64748b;font-weight:600;text-transform:uppercase;letter-spacing:1px">📊 Mi Cartera · Oscar</div>
    <div class="stats">
      <div class="stat"><div class="stat-val" style="color:#00d4aa">▲ ${up}</div><div class="stat-label">subieron</div></div>
      <div class="stat"><div class="stat-val" style="color:#ff4d6d">▼ ${down}</div><div class="stat-label">bajaron</div></div>
      <div class="stat"><div class="stat-val">${assets.length}</div><div class="stat-label">activos</div></div>
    </div>
    <div style="font-size:12px;color:#334155;margin-top:12px">🎯 Meta: jubilación en 20 años</div>
  </div>`;
  cats.forEach(cat => {
    const group = assets.filter(a=>a.category===cat);
    if (!group.length) return;
    html += `<div class="category-title">${cat}s</div>`;
    group.forEach(a => {
      const pos = a.changePercent >= 0;
      const color = CAT_COLORS[a.category] || '#6b7280';
      const sym = a.symbol.replace('.BA','');
      const cur = a.currency === 'ARS' ? '$' : 'USD ';
      html += `<div class="card">
        <div class="card-header">
          <div class="card-left">
            <span class="symbol">${sym}</span>
            <span class="badge" style="color:${color};border-color:${color};background:${color}20">${a.category}</span>
          </div>
          <span class="alloc">${a.allocation}%</span>
        </div>
        <div class="name">${a.name}</div>
        <div class="price-row">
          <span class="price">${cur}${a.currentPrice?.toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2})}</span>
          <span class="change ${pos?'up':'down'}">${pos?'▲':'▼'} ${Math.abs(a.changePercent).toFixed(2)}%</span>
        </div>
      </div>`;
    });
  });
  document.getElementById('content').innerHTML = html;
}
</script>
</body>
</html>
